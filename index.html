<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>서울 아파트 실거래가 지도</title>
<meta name="description" content="서울시 아파트 매매·전세·월세 실거래가 지도 — 단지별 최근 거래가와 평당가. 서울 열린데이터광장 자료.">
<meta name="theme-color" content="#7A2E38">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/app-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아파트 시세">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <svg class="sign-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="5" y="3" width="14" height="18"/>
      <rect x="7.3" y="5.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="10.7" y="5.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="14.1" y="5.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="7.3" y="9.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="10.7" y="9.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="14.1" y="9.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="7.3" y="13.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="14.1" y="13.3" width="2.6" height="2.6" fill="var(--sign)"/>
      <rect x="10.2" y="15" width="3.6" height="6" fill="var(--sign)"/>
    </svg>
    <div class="sign-text">
      <h1 class="app-title">서울 아파트 실거래가</h1>
    </div>
    <p class="sign-count"><span class="num" id="totalCount"></span><span class="unit">단지</span></p>
  </div>
  <p class="app-notice">서울 열린데이터광장 2025~2026년 아파트 매매·전월세 자료를 단지 단위로 모았습니다. 참고용이며 실제 거래는 등기·중개업소를 통해 확인하세요.</p>
</header>

<main class="container">

  <section class="panel mode-bar">
    <div class="mode-row">
      <div class="mode-toggle" id="modeToggle"></div>
      <span class="mode-count" id="modeCount"></span>
      <button class="filter-toggle-btn" id="filterToggleBtn" type="button"
              title="필터 열기" aria-label="필터 열기" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 9l7 7 7-7"/></svg>
      </button>
    </div>
    <div class="view-toggle" id="viewToggle">
      <button class="pill active" data-view="map" type="button">지도</button>
      <button class="pill" data-view="list" type="button">목록</button>
    </div>
    <div class="filter-groups" id="filterGroups" hidden>
      <div class="search-row">
        <input type="search" id="searchInput" class="search-input" placeholder="단지명이나 동으로 검색해 보세요" autocomplete="off">
        <select id="guSelect" class="gu-select" aria-label="자치구 선택">
          <option value="">전체 자치구</option>
        </select>
        <select id="dongSelect" class="gu-select" aria-label="동 선택" disabled>
          <option value="">전체 동</option>
        </select>
      </div>
      <div class="filter-row">
        <label class="filter-field">
          <span class="filter-lbl">가격(억)</span>
          <input type="number" id="priceMin" placeholder="최소" min="0" inputmode="decimal">
          <span class="filter-sep">~</span>
          <input type="number" id="priceMax" placeholder="최대" min="0" inputmode="decimal">
        </label>
        <label class="filter-field">
          <span class="filter-lbl">면적(평)</span>
          <input type="number" id="areaMin" placeholder="최소" min="0" inputmode="decimal">
          <span class="filter-sep">~</span>
          <input type="number" id="areaMax" placeholder="최대" min="0" inputmode="decimal">
        </label>
        <label class="filter-field">
          <span class="filter-lbl">2026년 전세가율(%)</span>
          <input type="number" id="ratioMin" placeholder="최소" min="0" max="100" inputmode="decimal">
          <span class="filter-sep">~</span>
          <input type="number" id="ratioMax" placeholder="최대" min="0" max="100" inputmode="decimal">
        </label>
        <button class="pill filter-reset" id="filterResetBtn" type="button">초기화</button>
      </div>
    </div>
  </section>

  <section class="content-grid">
    <div class="map-pane">
      <div id="map"></div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
    <div class="list-pane">
      <div class="list-header">
        <span class="list-title">단지 목록</span>
        <select id="sortSelect" class="sort-select" aria-label="정렬">
          <option value="recent">최신거래순</option>
          <option value="priceDesc">가격 높은순</option>
          <option value="priceAsc">가격 낮은순</option>
        </select>
        <span class="list-count" id="listCount"></span>
      </div>
      <div class="complex-list" id="complexList"></div>
      <button class="list-more-btn" id="listMoreBtn" type="button" hidden>더 보기</button>
      <p class="list-empty" id="listEmpty" hidden>조건에 맞는 단지가 없어요. 필터를 조정해 보세요.</p>
    </div>
  </section>

  <footer class="app-footer">
    <p>자료: 서울 열린데이터광장 「부동산 실거래가 정보」·「부동산 전월세가 정보」 (생성일 <span id="genDate"></span>) · 실제 시세와 다를 수 있습니다.</p>
  </footer>
</main>

<div class="site-notice" role="note">
  © 2026 서울 아파트 실거래가 지도 · 무단 복제를 금합니다. 본 사이트는 정보 공유 목적으로 제공됩니다.
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
